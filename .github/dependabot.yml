version: 2
updates:
  - package-ecosystem: "pub"
    directories:
      - "/jaspr_content_snippets"
      - "/shelf_multipart"
      - "/weblocks"
    schedule:
      interval: "quarterly"
    versioning-strategy: "increase-if-necessary"
    groups:
      dart-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    groups:
      github-actions:
        patterns:
          - "*"
